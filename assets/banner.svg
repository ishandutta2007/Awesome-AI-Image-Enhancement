<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.28; }
        50% { transform: scale(1.15); opacity: 0.42; }
      }
      @keyframes scanline {
        0% { transform: translateX(-400px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
        50% { border-color: rgba(56, 189, 248, 0.7); }
      }
      .orb-1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 250px;
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .scan-beam {
        animation: scanline 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.025em;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Grid in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Ambient Animated Glowing Orbs (Strictly Background Layer) -->
  <g>
    <circle class="orb-1" cx="220" cy="90" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)"/>
    <circle class="orb-2" cx="1020" cy="230" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)"/>
  </g>

  <!-- Animated Scanning Beam behind content -->
  <g opacity="0.12">
    <rect class="scan-beam" y="0" width="300" height="360" fill="url(#primaryGrad)" filter="url(#blurFilter)"/>
  </g>

  <!-- Decorative Background Visual Elements (Behind Text) -->
  <g class="floating-card-1" opacity="0.3" transform="translate(970, 45)">
    <rect width="170" height="100" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="18" y="36" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">SUPER RESOLUTION</text>
    <text x="18" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">4K • 8K Real-ESRGAN</text>
    <path d="M 18 80 L 152 80" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="80" r="3" fill="#38bdf8"/>
    <circle cx="75" cy="80" r="3" fill="#818cf8"/>
    <circle cx="140" cy="80" r="3" fill="#f472b6"/>
  </g>

  <g class="floating-card-2" opacity="0.3" transform="translate(60, 205)">
    <rect width="180" height="90" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2"/>
    <text x="18" y="34" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">FACE RESTORATION</text>
    <text x="18" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">CodeFormer • GFPGAN</text>
    <circle cx="146" cy="30" r="5" fill="#10b981"/>
    <text x="141" y="74" fill="#64748b" font-family="monospace" font-size="9">FID: 21.4</text>
  </g>

  <!-- BORDER FRAME -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, fully in front -->
  <!-- Top Badge -->
  <g transform="translate(435, 48)">
    <rect width="330" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="34" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.04em">
      ⚡ CURATED ECOSYSTEM &amp; BENCHMARKS
    </text>
  </g>

  <!-- Main Title -->
  <text class="title-text" x="600" y="145" text-anchor="middle" font-size="44" fill="url(#primaryGrad)" filter="url(#glowEffect)">
    Awesome AI Image Enhancement
  </text>
  <text class="title-text" x="600" y="145" text-anchor="middle" font-size="44" fill="#ffffff">
    Awesome AI Image Enhancement
  </text>

  <!-- Subtitle -->
  <text class="body-text" x="600" y="195" text-anchor="middle" font-size="18.5" fill="#94a3b8" font-weight="400" letter-spacing="0.02em">
    Super-Resolution • Face Restoration • Real-World Denoising • Enterprise SaaS &amp; Open Models
  </text>

  <!-- Dynamic Feature Badges / Interactive Tags Bar -->
  <g transform="translate(195, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="175" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <text x="87" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🔍 Super-Resolution</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(190, 0)">
      <rect width="180" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">👤 Face Restoration</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(385, 0)">
      <rect width="175" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1"/>
      <text x="87" y="24" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✨ Generative Prior</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(575, 0)">
      <rect width="235" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
      <text x="117" y="24" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">📊 Pricing &amp; Market Dynamics</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(370, 315)">
    <text class="body-text" x="0" y="0" fill="#64748b" font-size="12" font-weight="500">
      🚀 100K+ Community Stars
    </text>
    <circle cx="160" cy="-4" r="2.5" fill="#475569"/>
    <text class="body-text" x="180" y="0" fill="#64748b" font-size="12" font-weight="500">
      🏢 Leading SaaS Compared
    </text>
    <circle cx="340" cy="-4" r="2.5" fill="#475569"/>
    <text class="body-text" x="360" y="0" fill="#64748b" font-size="12" font-weight="500">
      🔓 SOTA Open Weights
    </text>
  </g>
</svg>
